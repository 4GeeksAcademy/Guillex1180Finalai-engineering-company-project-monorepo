services:
  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
    init: true
    command: ["./start.sh"]
    environment:
      TRACKFLOW_API_URL: ${TRACKFLOW_API_URL:-http://backend:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis/application:/workspace/application
      - ./uis/backoffice:/workspace/backoffice
      - ./uis/start.sh:/workspace/start.sh:ro
      - application_node_modules:/workspace/application/node_modules
      - backoffice_node_modules:/workspace/backoffice/node_modules
      - application_next:/workspace/application/.next
      - backoffice_next:/workspace/backoffice/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trackflow-network

  backend:
    build:
      context: ./services
      dockerfile: Dockerfile
      additional_contexts:
        root: .
    init: true
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the ignored root .env file; copy .env.docker.example to .env first}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # Never point this local development stack at a production Supabase URL.
      SUPABASE_DATABASE_URL: ""
      INVENTORY_DATABASE_URL: sqlite:////data/trackflow_inventory.db
      TINYDB_PATH: /data/trackflow_users.json
      BACKOFFICE_CORS_ORIGINS: ${BACKOFFICE_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "8000:8000"
    volumes:
      - ./services:/app/services
      - ./scripts:/app/scripts:ro
      - trackflow_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - trackflow-network

networks:
  trackflow-network:
    name: trackflow-network
    driver: bridge

volumes:
  application_node_modules:
  backoffice_node_modules:
  application_next:
  backoffice_next:
  trackflow_data: